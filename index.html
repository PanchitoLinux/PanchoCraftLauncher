<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 1. Le dice a Google que elimine esta URL y le dé la fuerza a la principal -->
    <link rel="canonical" href="https://panchitolinux.github.io/" />
    
    <!-- 2. Redirige a los usuarios automáticamente -->
    <meta http-equiv="refresh" content="0; url=https://panchitolinux.github.io/">
    
    <!-- 3. Pide a los buscadores que no muestren más este enlace viejo -->
    <meta name="robots" content="noindex, follow">
    
    <title>Mudanza de sitio web</title>
</head>
<body>
    <p>Nos hemos mudado a nuestra portada principal. Si no eres redirigido, <a href="https://panchitolinux.github.io/">haz clic aquí</a>.</p>
</body>
</html>
